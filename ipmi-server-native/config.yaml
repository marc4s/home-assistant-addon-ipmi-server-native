---
name: "IPMItool server native"
version: "2.7.8"
slug: "ipmi-server-native"
description: "IPMItool server native"
url: "https://github.com/marc4s/home-assistant-addon-ipmi-server-native"
arch:
  - amd64

panel_icon: "mdi:server"
init: false
hassio_api: true
ingress: true
ingress_stream: true
ingress_entry: ui

options:
  log_level: "info"

schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

ports:
  80/tcp: 9596

ports_description:
  80/tcp: "Web UI / API (also available via Ingress)"

# For published releases, set this so Supervisor pulls the prebuilt image.
# For local Dockerfile builds/testing, comment it out.
image: "ghcr.io/marc4s/ipmi-server-native/{arch}"
